c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/memory-systems/10-image-10.png\" alt=\"image.png\">\u003c/p>\n\u003cp>字扩展\u003c/p>\n\u003cp>增加主存的存储字数\u003c/p>\n\u003cp>线选法\u003c/p>\n\u003cp>n条线→n个选片信号\u003c/p>\n\u003cp>地址空间不连续\u003c/p>\n\u003cp>译码片选法\u003c/p>\n\u003cp>n条线→\u003cspan class=\"math-inline\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmi>n\u003c/mi>\u003c/msup>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">2^n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.6644em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">2\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6644em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"katex-sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>个选片信号\u003c/p>\n\u003cp>地址空间可连续\u003c/p>\n\u003cp>字位同时扩展\u003c/p>\n","tags":["FORMULA","IMAGE"],"children":[]}]},{"id":"3-4","title":"3.4 外部存储器","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"3-4-disk","title":"磁盘存储器","hasDetail":true,"detailHtml":"\u003cp>3.4 外部存储器\u003c/p>\n\u003cp>磁盘存储器\u003c/p>\n\u003cp>优点\u003c/p>\n\u003cp>存储容量大，位价格低\u003c/p>\n\u003cp>记录介质可以重复使用\u003c/p>\n\u003cp>记录信息长期不丢失\u003c/p>\n\u003cp>非破坏性读出\u003c/p>\n\u003cp>缺点\u003c/p>\n\u003cp>存取速度慢\u003c/p>\n\u003cp>机械结构复杂\u003c/p>\n\u003cp>对工作环境要求高\u003c/p>\n\u003cp>组成\u003c/p>\n\u003cp>存储区域\u003c/p>\n\u003cp>磁头数\u003c/p>\n\u003cp>柱面数\u003c/p>\n\u003cp>扇区数\u003c/p>\n\u003cp>磁盘驱动器\u003c/p>\n\u003cp>磁盘控制器\u003c/p>\n\u003cp>性能指标\u003c/p>\n\u003cp>容量\u003c/p>\n\u003cp>存储的字节总数\u003c/p>\n\u003cp>非格式化容量\u003c/p>\n\u003cp>记录面数×柱面数×每条磁道的磁化单元数\u003c/p>\n\u003cp>格式化容量\u003c/p>\n\u003cp>记录面数×柱面数×每道扇区数×每个扇区的容量\u003c/p>\n\u003cp>记录密度\u003c/p>\n\u003cp>道密度\u003c/p>\n\u003cp>位密度\u003c/p>\n\u003cp>位密度×道密度\u003c/p>\n\u003cp>平均存取时间\u003c/p>\n\u003cp>寻道时间\u003c/p>\n\u003cp>旋转时间\u003c/p>\n\u003cp>传输时间\u003c/p>\n\u003cp>数据传输率\u003c/p>\n\u003cp>单位时间内向主机传送数据的字节数\u003c/p>\n\u003cp>磁盘地址\u003c/p>\n\u003cp>驱动器号\u003c/p>\n\u003cp>柱面号（磁道号）\u003c/p>\n\u003cp>盘面号\u003c/p>\n\u003cp>扇区号\u003c/p>\n","tags":[],"children":[]},{"id":"3-4-raid","title":"磁盘阵列 RAID","hasDetail":true,"detailHtml":"\u003cp>磁盘阵列RAID\u003c/p>\n\u003cp>RAID0\u003c/p>\n\u003cp>无冗余和无校验\u003c/p>\n\u003cp>RAID1\u003c/p>\n\u003cp>镜像\u003c/p>\n\u003cp>RAID2\u003c/p>\n\u003cp>纠错的海明码\u003c/p>\n\u003cp>RAID3\u003c/p>\n\u003cp>位交叉奇偶校验\u003c/p>\n\u003cp>RAID4\u003c/p>\n\u003cp>块交叉奇偶校验\u003c/p>\n\u003cp>RAID5\u003c/p>\n\u003cp>无独立校验的奇偶校验\u003c/p>\n","tags":[],"children":[]},{"id":"3-4-ssd","title":"固态硬盘","hasDetail":true,"detailHtml":"\u003cp>固态硬盘\u003c/p>\n\u003cp>原理：Flash Memory\u003c/p>\n\u003cp>组成\u003c/p>\n\u003cp>闪存翻译层\u003c/p>\n\u003cp>存储介质\u003c/p>\n\u003cp>多个闪存芯片\u003c/p>\n\u003cp>读写性能特性\u003c/p>\n\u003cp>以页为单位读写\u003c/p>\n\u003cp>相当于磁盘的扇区\u003c/p>\n\u003cp>以块为单位擦除\u003c/p>\n\u003cp>支持随机访问\u003c/p>\n\u003cp>读快、写慢\u003c/p>\n\u003cp>与机械硬盘相比\u003c/p>\n\u003cp>SSD读写速度快，随机访问性能高\u003c/p>\n\u003cp>SSD安静无噪音、耐摔抗震、能耗低、造价更贵\u003c/p>\n\u003cp>SSD一个块被擦除次数过多可能会坏掉\u003c/p>\n\u003cp>磨损均衡技术\u003c/p>\n\u003cp>将擦除平均分布在各个块上\u003c/p>\n\u003cp>动态磨损均衡\u003c/p>\n\u003cp>写入时优先选择累计擦除次数少的新闪存块\u003c/p>\n\u003cp>静态磨损均衡\u003c/p>\n\u003cp>SSD监测并自动进行数据分配迁移\u003c/p>\n","tags":[],"children":[]}]},{"id":"3-5","title":"3.5 高速缓冲存储器","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"3-5-locality","title":"局部性原理","hasDetail":true,"detailHtml":"\u003cp>3.5 高速缓冲存储器\u003c/p>\n\u003cp>局部性原理\u003c/p>\n\u003cp>空间局部性\u003c/p>\n\u003cp>最近要用到的信息，很可能与现在正在使用的信息在存储空间上是相邻的\u003c/p>\n\u003cp>时间局部性\u003c/p>\n\u003cp>最近要用到的信息很可能是现在正在使用的\u003c/p>\n","tags":[],"children":[]},{"id":"3-5-principle","title":"基本工作原理","hasDetail":true,"detailHtml":"\u003cp>基本工作原理\u003c/p>\n\u003cp>数据查找\u003c/p>\n\u003cp>地址映射\u003c/p>\n\u003cp>替换策略\u003c/p>\n\u003cp>写入策略\u003c/p>\n","tags":[],"children":[]},{"id":"3-5-mapping","title":"Cache 和主存的映射方式","hasDetail":true,"detailHtml":"\u003cp>Cache和主存的映射方式\u003c/p>\n\u003cp>直接映射\u003c/p>\n\u003cp>主存块号 mod Cache总行数\u003c/p>\n\u003cp>全相联映射\u003c/p>\n\u003cp>可以装入任何位置\u003c/p>\n\u003cp>组相联映射\u003c/p>\n\u003cp>主存块号 mod Cache组数\u003c/p>\n","tags":[],"children":[]},{"id":"3-5-replacement","title":"Cache 替换算法","hasDetail":true,"detailHtml":"\u003cp>Cache替换算法\u003c/p>\n\u003cp>随机算法RAND\u003c/p>\n\u003cp>先进先出算法FIFO\u003c/p>\n\u003cp>近期最少使用LRU\u003c/p>\n\u003cp>命中时，命中行的计数器清零，比其低的计数器+1，其余不变\u003c/p>\n\u003cp>未命中还有空闲行，新装入的行计数器置0，其余非空闲行全+1\u003c/p>\n\u003cp>未命中且无空闲行时，计数值最大的行的信息块被淘汰，新装行的块的计数器置0，其余全部+1\u003c/p>\n\u003cp>最近不经常使用LFU\u003c/p>\n\u003cp>新调入的块计数器=0，之后每被访问一次计数器+1。需要替换时，选择计数器最小的一行\u003c/p>\n\u003cp>曾经经常访问的块，在未来不一定会用到\u003c/p>\n","tags":[],"children":[]},{"id":"3-5-write","title":"Cache 写策略","hasDetail":true,"detailHtml":"\u003cp>Cache写策略\u003c/p>\n\u003cp>写命中\u003c/p>\n\u003cp>\u003cstrong>全写法\u003c/strong>\u003c/p>\n\u003cp>对Cache写命中时，必须把数据同时写入Cache\u003c/p>\n\u003cp>\u003cstrong>回写法\u003c/strong>\u003c/p>\n\u003cp>只修改Cache内容，只有当此块被换出时才写回主存\u003c/p>\n\u003cp>写不命中\u003c/p>\n\u003cp>\u003cstrong>写分配法\u003c/strong>\u003c/p>\n\u003cp>写不命中时，把主存中的块调入Cache,在Cache中修改\u003c/p>\n\u003cp>\u003cstrong>非写分配法\u003c/strong>\u003c/p>\n\u003cp>写不命中时，只写入主存，不调入Cache\u003c/p>\n","tags":[],"children":[]},{"id":"3-5-levels","title":"多级 Cache","hasDetail":true,"detailHtml":"\u003cp>多级Cache\u003c/p>\n\u003cp>各级之间 全写+非写分配\u003c/p>\n\u003cp>Cache和主存 写回法+写分配法\u003c/p>\n","tags":[],"children":[]}]}]}</script></section></main><footer class="site-footer"><div class="footer-inner wrap"><p>© 2026 Vangie</p></div></footer></body></html>
