a-label="Reset mind map">Reset</button><button type="button" aria-label="Collapse all branches">Collapse all</button></div><div class="mind-map-viewport" tabindex="0"><svg class="mind-map-connectors" aria-hidden="true"></svg><div class="mind-map-world"><div class="mind-map-nodes"><button class="mind-map-node mind-map-node--root" type="button" data-node-id="root" aria-expanded="true">输入/输出系统</button><button class="mind-map-node mind-map-node--section" type="button" data-node-id="7-2" aria-expanded="false">7.2 I/O 接口</button><button class="mind-map-node mind-map-node--section" type="button" data-node-id="7-3" aria-expanded="false">7.3 I/O 方式</button></div></div><p class="mind-map-fallback">Interactive expansion requires JavaScript.</p></div><script type="application/json" id="mind-map-data">{"id":"root","title":"输入/输出系统","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"7-2","title":"7.2 I/O 接口","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"7-2-definition","title":"定义与作用","hasDetail":true,"detailHtml":"\u003cp>7.2 I/O接口\u003c/p>\n\u003cp>定义\u003c/p>\n\u003cp>I/O接口、I/O控制器、设备控制器\u003c/p>\n\u003cp>负责协调主机与外部设备之间的数据传输\u003c/p>\n\u003cp>作用\u003c/p>\n\u003cp>数据缓冲\u003c/p>\n\u003cp>错误或状态监测\u003c/p>\n\u003cp>控制和定时\u003c/p>\n\u003cp>数据格式转换：串并、并串\u003c/p>\n\u003cp>与主机和设备通信：主机-I/O接口-I/O设备\u003c/p>\n","tags":[],"children":[]},{"id":"7-2-structure","title":"基本结构","hasDetail":true,"detailHtml":"\u003cp>基本结构\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/11-image.png\" alt=\"image.png\">\u003c/p>\n\u003cp>数据端口\u003c/p>\n\u003cp>读写数据、状态字、控制字、中断类型号\u003c/p>\n\u003cp>地址端口\u003c/p>\n\u003cp>指明I/O端口\u003c/p>\n\u003cp>I/O控制器中的各种寄存器称为I/O端口\u003c/p>\n\u003cp>控制端口\u003c/p>\n\u003cp>读写I/O端口的信号、中断请求信号\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"7-2-addressing","title":"I/O 端口的编址方式","hasDetail":true,"detailHtml":"\u003cp>I/O端口的编址方式\u003c/p>\n\u003cp>统一编址（存储器映射方式）\u003c/p>\n\u003cp>把I/O端口当做存储器的单元进行地址分配\u003c/p>\n\u003cp>用统一的访存指令进行访问\u003c/p>\n\u003cp>用\u003cstrong>不同的地址码区分\u003c/strong>内存和I/O\u003c/p>\n\u003cp>缺点：占用了主存地址空间，寻址时间长\u003c/p>\n\u003cp>独立编址（I/O映射方式）\u003c/p>\n\u003cp>I/O端口地址与存储器地址无关\u003c/p>\n\u003cp>用专门的输入/输出指令访问端口\u003c/p>\n\u003cp>用\u003cstrong>不同的指令区分\u003c/strong>内存和I/O\u003c/p>\n\u003cp>缺点：I/O指令类型少，只能进行传送操作，灵活性差；需要CPU提供存储器读/写、I/O设备读/写两组控制信号，增加了控制电路的复杂性\u003c/p>\n","tags":[],"children":[]},{"id":"7-2-types","title":"I/O 接口的类型","hasDetail":true,"detailHtml":"\u003cp>I/O接口的类型\u003c/p>\n\u003cp>按数据传送方式分\u003c/p>\n\u003cp>并行接口\u003c/p>\n\u003cp>串行接口\u003c/p>\n\u003cp>按主机访问I/O设备的控制方式\u003c/p>\n\u003cp>程序查询接口\u003c/p>\n\u003cp>中断接口\u003c/p>\n\u003cp>DMA接口\u003c/p>\n\u003cp>按功能选择的灵活性\u003c/p>\n\u003cp>可编程接口\u003c/p>\n\u003cp>不可编程接口\u003c/p>\n","tags":[],"children":[]}]},{"id":"7-3","title":"7.3 I/O 方式","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"7-3-query","title":"程序查询方式","hasDetail":true,"detailHtml":"\u003cp>7.3 I/O方式\u003c/p>\n\u003cp>程序查询方式\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/01-image-1.png\" alt=\"image.png\">\u003c/p>\n\u003cp>特点：CPU有“踏步”等待现象，CPU和I/O串行\u003c/p>\n\u003cp>缺点：CPU花费很多时间用于查询和等待\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"7-3-interrupt","title":"程序中断方式","hasDetail":true,"detailHtml":"\u003cp>程序中断方式\u003c/p>\n\u003cp>中断的作用和原理\u003c/p>\n\u003cp>中断请求\u003c/p>\n\u003cp>中断响应\u003c/p>\n\u003cp>响应中断的条件\u003c/p>\n\u003cp>1.中断源有中断请求\u003c/p>\n\u003cp>2.CPU允许中断，开中断\u003c/p>\n\u003cp>3.一条指令执行完毕且没有更紧迫的任务\u003c/p>\n\u003cp>中断判优\u003c/p>\n\u003cp>硬件排队器\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/02-image-2.png\" alt=\"image.png\">\u003c/p>\n\u003cp>查询程序\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/03-image-3.png\" alt=\"image.png\">\u003c/p>\n\u003cp>中断处理\u003c/p>\n\u003cp>中断隐指令\u003c/p>\n\u003cp>1.关中断：保证不被新的中断所打断\u003c/p>\n\u003cp>2.保存断点：把原PC保存起来\u003c/p>\n\u003cp>3.引入中断服务程序：取出入口地址传给PC\u003c/p>\n\u003cp>软件查询法\u003c/p>\n\u003cp>硬件向量法\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/04-image-4.png\" alt=\"image.png\">\u003c/p>\n\u003cp>中断服务程序\u003c/p>\n\u003cp>1.保护现场\u003c/p>\n\u003cp>2.中断服务\u003c/p>\n\u003cp>3.恢复现场\u003c/p>\n\u003cp>4.中断返回\u003c/p>\n\u003cp>单重中断与多重中断\u003c/p>\n\u003cp>单重中断\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/05-image-5.png\" alt=\"image.png\">\u003c/p>\n\u003cp>多重中断（中断嵌套）\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/06-image-6.png\" alt=\"image.png\">\u003c/p>\n\u003cp>中断屏蔽技术\u003c/p>\n\u003cp>1.在中断服务程序中要提前开中断指令\u003c/p>\n\u003cp>2.优先级高的中断源有权中断优先级低的\u003c/p>\n\u003cp>屏蔽触发器\u003c/p>\n\u003cp>1表示屏蔽请求，0表示正常申请\u003c/p>\n\u003cp>屏蔽字寄存器\u003c/p>\n\u003cp>所有的屏蔽触发器组合在一起\u003c/p>\n\u003cp>屏蔽字\u003c/p>\n\u003cp>屏蔽字寄存器的内容\u003c/p>\n\u003cp>举例\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/07-image-7.png\" alt=\"image.png\">\u003c/p>\n\u003cp>程序中断方式\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/08-image-8.png\" alt=\"image.png\">\u003c/p>\n\u003cp>CPU占用情况\u003c/p>\n\u003cp>中断响应\u003c/p>\n\u003cp>中断服务程序\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"7-3-dma","title":"DMA 方式","hasDetail":true,"detailHtml":"\u003cp>DMA方式\u003c/p>\n\u003cp>DMA控制器\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/09-image-9.png\" alt=\"image.png\">\u003c/p>\n\u003cp>传送前：接收外设的DMA请求，向CPU发出总线请求，接管总线控制权\u003c/p>\n\u003cp>传送时：确定传送数据的主存单元地址及长度，自动修改地址计数和传送长度计数\u003c/p>\n\u003cp>传送后：向CPU报告DMA操作结束\u003c/p>\n\u003cp>组成\u003c/p>\n\u003cp>主存地址计数器\u003c/p>\n\u003cp>传送长度计数器\u003c/p>\n\u003cp>数据缓冲寄存器\u003c/p>\n\u003cp>DMA请求触发器\u003c/p>\n\u003cp>控制状态逻辑\u003c/p>\n\u003cp>中断机构\u003c/p>\n\u003cp>DMA传送过程\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/input-output-systems/10-image-10.png\" alt=\"image.png\">\u003c/p>\n\u003cp>预处理\u003c/p>\n\u003cp>数据传送\u003c/p>\n\u003cp>后处理\u003c/p>\n\u003cp>三总线存在的问题\u003c/p>\n\u003cp>DMA和CPU访问主存冲突\u003c/p>\n\u003cp>解决办法\u003c/p>\n\u003cp>停止CPU访问主存\u003c/p>\n\u003cp>DMA和CPU交替访存\u003c/p>\n\u003cp>周期挪用\u003c/p>\n\u003cp>三总线特点\u003c/p>\n\u003cp>DMA传送数据不需要经过CPU，所以不需要中断现行程序\u003c/p>\n\u003cp>I/O与主机并行工作，程序和传送并行工作\u003c/p>\n","tags":["IMAGE"],"children":[]}]}]}</script></section></main><footer class="site-footer"><div class="footer-inner wrap"><p>© 2026 Vangie</p></div></footer></body></html>
