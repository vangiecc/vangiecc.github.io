\n\u003cp>运算器\u003c/p>\n\u003cp>算数逻辑单元ALU\u003c/p>\n\u003cp>暂存寄存器\u003c/p>\n\u003cp>累加寄存器ACC\u003c/p>\n\u003cp>通用寄存器GPRs\u003c/p>\n\u003cp>程序状态字寄存器PSW\u003c/p>\n\u003cp>移位寄存器\u003c/p>\n\u003cp>控制器\u003c/p>\n\u003cp>程序计数器PC\u003c/p>\n\u003cp>指令寄存器IR\u003c/p>\n\u003cp>指令译码器ID\u003c/p>\n\u003cp>存储器地址寄存器MAR\u003c/p>\n\u003cp>存储器数据寄存器MDR\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/01-image-1.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]}]},{"id":"5-2","title":"5.2 指令执行过程","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"5-2-cycle","title":"指令周期","hasDetail":true,"detailHtml":"\u003cp>5.2 指令执行过程\u003c/p>\n\u003cp>指令周期\u003c/p>\n\u003cp>CPU从主存取出并执行一条指令所需的全部时间\u003c/p>\n\u003cp>指令周期由若干**机器周期（CPU周期）**组成\u003c/p>\n\u003cp>机器周期包含若干\u003cstrong>时钟周期（节拍、CPU时钟周期）\u003c/strong>\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/02-image-2.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"5-2-dataflow","title":"指令周期的数据流","hasDetail":true,"detailHtml":"\u003cp>指令周期的数据流\u003c/p>\n\u003cp>取址周期\u003c/p>\n\u003cp>(PC)→MAR\u003c/p>\n\u003cp>1→R\u003c/p>\n\u003cp>M(MAR)→MDR\u003c/p>\n\u003cp>MDR→IR\u003c/p>\n\u003cp>(PC)+1→PC\u003c/p>\n\u003cp>间址周期\u003c/p>\n\u003cp>Ad(IR)→MAR\u003c/p>\n\u003cp>或者Ad(MDR)→MAR\u003c/p>\n\u003cp>1→R\u003c/p>\n\u003cp>M(MAR)→MDR\u003c/p>\n\u003cp>(MDR)→Ad(IR)\u003c/p>\n\u003cp>把有效地址送到指令的地址码字段\u003c/p>\n\u003cp>执行周期\u003c/p>\n\u003cp>中断周期\u003c/p>\n\u003cp>CU：(SP)-1→SP,(SP)→MAR\u003c/p>\n\u003cp>保存断点\u003c/p>\n\u003cp>1→W\u003c/p>\n\u003cp>(PC)→MDR\u003c/p>\n\u003cp>向量地址→PC\u003c/p>\n","tags":[],"children":[]},{"id":"5-2-schemes","title":"指令执行方案","hasDetail":true,"detailHtml":"\u003cp>指令执行方案\u003c/p>\n\u003cp>单指令周期\u003c/p>\n\u003cp>所有指令选用相同的执行时间\u003c/p>\n\u003cp>串行执行\u003c/p>\n\u003cp>多指令周期\u003c/p>\n\u003cp>不同类型的指令选用不同的执行步骤完成\u003c/p>\n\u003cp>串行执行\u003c/p>\n\u003cp>流水线周期\u003c/p>\n\u003cp>多条指令同时运行\u003c/p>\n\u003cp>并行执行\u003c/p>\n","tags":[],"children":[]}]},{"id":"5-3","title":"5.3 数据通路的功能和基本结构","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"5-3-definition","title":"异常、中断与数据通路","hasDetail":true,"detailHtml":"\u003cp>5.3 数据通路的功能和基本功能\u003c/p>\n\u003cp>异常和中断\u003c/p>\n\u003cp>异常\u003c/p>\n\u003cp>内中断：CPU内部产生的意外\u003c/p>\n\u003cp>中断\u003c/p>\n\u003cp>外中断：来自CPU外部的设备向CPU发出的中断请求\u003c/p>\n\u003cp>数据通路的定义\u003c/p>\n\u003cp>数据在指令执行过程中所经过的路径，包括路径上的部件\u003c/p>\n","tags":[],"children":[]},{"id":"5-3-structures","title":"数据通路的基本结构","hasDetail":true,"detailHtml":"\u003cp>数据通路的基本结构\u003c/p>\n\u003cp>CPU内部单总线方式\u003c/p>\n\u003cp>区分：内部总线和系统总线\u003c/p>\n\u003cp>内部总线：CPU内部连接各寄存器及运算部件之间的总线\u003c/p>\n\u003cp>系统总线：同一台计算机系统的各部件，CPU、内存、通道和各类I/O接口间互相连接的总线\u003c/p>\n\u003cp>寄存器之间数据传送\u003c/p>\n\u003cp>主存和CPU之间的数据传送\u003c/p>\n\u003cp>执行算术或逻辑运算\u003c/p>\n\u003cp>*ALU需要配合暂存器使用\u003c/p>\n\u003cp>单周期处理器（CPI=1）不能采用单总线方式，因为单总线将所有寄存器都连接到一根公共总线上，一个时钟内只允许一次操作，无法完成一条指令的所有操作\u003c/p>\n\u003cp>CPU内部多总线方式\u003c/p>\n\u003cp>专用数据通路方式\u003c/p>\n\u003cp>根据指令执行过程中数据和地址的流动方向安排电路，避免使用共享的总线\u003c/p>\n","tags":[],"children":[]}]},{"id":"5-4","title":"5.4 控制器的功能和工作原理","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"5-4-hardwired","title":"硬布线控制器","hasDetail":true,"detailHtml":"\u003cp>5.4 控制器的功能和工作原理\u003c/p>\n\u003cp>硬布线控制器\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/03-image-3.png\" alt=\"image.png\">\u003c/p>\n\u003cp>设计步骤\u003c/p>\n\u003cp>分析每个阶段的微操作序列\u003c/p>\n\u003cp>选择CPU的控制方式\u003c/p>\n\u003cp>安排微操作时序\u003c/p>\n\u003cp>电路设计\u003c/p>\n\u003cp>取指周期\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/04-image-4.png\" alt=\"image.png\">\u003c/p>\n\u003cp>间址周期\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/05-image-5.png\" alt=\"image.png\">\u003c/p>\n\u003cp>执行周期\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/06-image-6.png\" alt=\"image.png\">\u003c/p>\n\u003cp>中断周期\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/07-image-7.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"5-4-microprogram","title":"微程序控制器","hasDetail":true,"detailHtml":"\u003cp>微程序控制器\u003c/p>\n\u003cp>程序：由指令序列组成\u003c/p>\n\u003cp>微程序：由微指令序列组成\u003c/p>\n\u003cp>每一种指令对应一个微程序\u003c/p>\n\u003cp>指令：对程序执行步骤的描述\u003c/p>\n\u003cp>微命令与微操作\u003c/p>\n\u003cp>相容性\u003c/p>\n\u003cp>不容性\u003c/p>\n\u003cp>微指令：对指令执行步骤的描述，是若干微命令的集合\u003c/p>\n\u003cp>微周期：取出并执行一条微指令所需的全部时间\u003c/p>\n\u003cp>微程序控制器的基本结构\u003c/p>\n\u003cp>微地址形成部件：产生初始和后继地址\u003c/p>\n\u003cp>微指令地址寄存器**\u003cspan class=\"math-inline\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>μ\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mu\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.625em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">μ\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>PC或CMAR：**存放待执行的微指令在CU中的微地址\u003c/p>\n\u003cp>控制存储器CM：微程序控制器的核心部件\u003c/p>\n\u003cp>微指令寄存器\u003cstrong>\u003cspan class=\"math-inline\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>μ\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mu\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.625em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">μ\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>IR或CMDR\u003c/strong>：存放读出的微指令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/08-image-8.png\" alt=\"image.png\">\u003c/p>\n\u003cp>微指令的格式\u003c/p>\n\u003cp>水平型\u003c/p>\n\u003cp>一条微指令定义多个可并行的微命令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/09-image-9.png\" alt=\"image.png\">\u003c/p>\n\u003cp>编码方式\u003c/p>\n\u003cp>直接编码\u003c/p>\n\u003cp>字段直接编码\u003c/p>\n\u003cp>字段间接编码\u003c/p>\n\u003cp>垂直型\u003c/p>\n\u003cp>一条微指令只能定义一个微命令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/10-image-10.png\" alt=\"image.png\">\u003c/p>\n\u003cp>混合型\u003c/p>\n\u003cp>在垂直型的基础上增加一些不太复杂的并行操作\u003c/p>\n\u003cp>下一条微指令地址的形成方式\u003c/p>\n\u003cp>断定法（下地址法）:从当前执行的微指令下地址找到下一条微指令\u003c/p>\n\u003cp>计数器法：\u003cspan class=\"math-inline\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>μ\u003c/mi>\u003cmi>P\u003c/mi>\u003cmi>C\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mu PC\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.8778em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">μ\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.1389em;\">P\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0715em;\">C\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>+1\u003c/p>\n\u003cp>根据指令操作码确定执行周期微程序首地址\u003c/p>\n\u003cp>专门的硬件指明取指/中断周期的微程序首地址\u003c/p>\n\u003cp>微程序控制单元的设计\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/11-image-11.png\" alt=\"image.png\">\u003c/p>\n","tags":["FORMULA","IMAGE"],"children":[]},{"id":"5-4-comparison","title":"硬布线与微程序的比较","hasDetail":true,"detai /span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003cp>机器周期的设置\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/19-image-19.png\" alt=\"image.png\">\u003c/p>\n\u003cp>每个功能段后面都有一个缓冲寄存器，称为锁存器\u003c/p>\n","tags":["FORMULA","IMAGE"],"children":[]},{"id":"5-6-hazards","title":"影响流水线的因素","hasDetail":true,"detailHtml":"\u003cp>影响流水线的因素\u003c/p>\n\u003cp>结构相关/资源冲突\u003c/p>\n\u003cp>原因：多条指令在同一时刻争用同一资源而形成的冲突\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/20-image-20.png\" alt=\"image.png\">\u003c/p>\n\u003cp>解决办法\u003c/p>\n\u003cp>后一相关指令暂停一周期\u003c/p>\n\u003cp>数据存储器+指令存储器\u003c/p>\n\u003cp>数据相关/数据冲突\u003c/p>\n\u003cp>原因：必须等前一条指令执行完后才能执行后一条指令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/21-image-21.png\" alt=\"image.png\">\u003c/p>\n\u003cp>解决办法\u003c/p>\n\u003cp>把遇到数据相关的指令及后续指令都暂停一至几个时钟周期\u003c/p>\n\u003cp>硬件阻塞stall\u003c/p>\n\u003cp>软件阻塞Nop\u003c/p>\n\u003cp>数据旁路技术：不用等前一条指令把数据写回寄存器，而是直接冲中间数据直接转发到ALU\u003c/p>\n\u003cp>编译优化：通过编译器调整指令顺序来解决数据相关\u003c/p>\n\u003cp>控制相关/控制冲突\u003c/p>\n\u003cp>当流水线遇到\u003cstrong>转移指令和其他改变PC值\u003c/strong>的命令而造成断流时，会引起相关控制\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/22-image-22.png\" alt=\"image.png\">\u003c/p>\n\u003cp>解决办法\u003c/p>\n\u003cp>转移分支预测\u003c/p>\n\u003cp>简单预测\u003c/p>\n\u003cp>动态预测\u003c/p>\n\u003cp>预取转移成功和不成功两个控制流方向上的目标指令\u003c/p>\n\u003cp>加快和提前形成条件码\u003c/p>\n\u003cp>提高转移方向的猜准率\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"5-6-classification","title":"流水线的分类","hasDetail":true,"detailHtml":"\u003cp>流水线的分类\u003c/p>\n\u003cp>使用的级别不同\u003c/p>\n\u003cp>部件功能级\u003c/p>\n\u003cp>处理机级\u003c/p>\n\u003cp>一条指令解释过程分为多个子过程\u003c/p>\n\u003cp>处理机间\u003c/p>\n\u003cp>每个处理机完成某一专门任务，各个处理机所得到的结果需存放在与下一处理机共享的存储器中\u003c/p>\n\u003cp>可以完成的功能不同\u003c/p>\n\u003cp>单功能\u003c/p>\n\u003cp>只能实现一种固定的专门功能的流水线\u003c/p>\n\u003cp>多功能\u003c/p>\n\u003cp>各段间的不同连接方式可以同时或不同时实现多种功能的流水线\u003c/p>\n\u003cp>同一时间内各段之间的连接方式\u003c/p>\n\u003cp>静态\u003c/p>\n\u003cp>同一时间段，同一种功能\u003c/p>\n\u003cp>动态\u003c/p>\n\u003cp>同一时间段，不同运算\u003c/p>\n\u003cp>各功能段之间是否有反馈信号\u003c/p>\n\u003cp>线性流水线\u003c/p>\n\u003cp>非线性流水线\u003c/p>\n","tags":[],"children":[]},{"id":"5-6-multiple-issue","title":"流水线的多发技术","hasDetail":true,"detailHtml":"\u003cp>流水线的多发技术\u003c/p>\n\u003cp>超标量技术\u003c/p>\n\u003cp>每个时钟周期内可并发多条独立指令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/23-image-23.png\" alt=\"image.png\">\u003c/p>\n\u003cp>超流水技术\u003c/p>\n\u003cp>一个时钟周期内再分段\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/central-processing-unit/24-image-24.png\" alt=\"image.png\">\u003c/p>\n\u003cp>超长指令字\u003c/p>\n\u003cp>多条能并行操作的指令组合成一条，具有多个操作码字段的超长指令字\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"5-6-five-stage","title":"五段式指令流水线","hasDetail":true,"detailHtml":"\u003cp>五段式指令流水线\u003c/p>\n\u003cp>运算类指令\u003c/p>\n\u003cp>LOAD指令\u003c/p>\n\u003cp>STORE指令\u003c/p>\n\u003cp>条件转移指令\u003c/p>\n\u003cp>无条件转移指令\u003c/p>\n","tags":[],"children":[]}]}]}</script></section></main><footer class="site-footer"><div class="footer-inner wrap"><p>© 2026 Vangie</p></div></footer></body></html>
