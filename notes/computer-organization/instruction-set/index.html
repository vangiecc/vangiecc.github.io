anization/assets/instruction-set/17-image.png\" alt=\"image.png\">\u003c/p>\n\u003cp>优点：有利于缩短指令字长\u003c/p>\n\u003cp>缺点：需增加存储操作数或隐含地址的硬件\u003c/p>\n\u003cp>立即寻址\u003c/p>\n\u003cp>A就是操作数本身，一般采用补码\u003c/p>\n\u003cp>优点：指令执行阶段不访问主存\u003c/p>\n\u003cp>缺点：A的位数限制了立即数的范围\u003c/p>\n\u003cp>直接寻址\u003c/p>\n\u003cp>EA=A\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/01-image-1.png\" alt=\"image.png\">\u003c/p>\n\u003cp>间接寻址\u003c/p>\n\u003cp>EA=(A）\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/02-image-2.png\" alt=\"image.png\">\u003c/p>\n\u003cp>优点：扩大寻址范围；便于编制程序\u003c/p>\n\u003cp>缺点：指令执行阶段需要多次访存\u003c/p>\n\u003cp>寄存器寻址\u003c/p>\n\u003cp>\u003cspan class=\"math-display\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmi>E\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">EA=R_i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E\u003c/span>\u003cspan class=\"mord mathnormal\">A\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.8333em;vertical-align:-0.15em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0077em;\">R\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3117em;\">\u003cspan style=\"top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"katex-sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/03-image-3.png\" alt=\"image.png\">\u003c/p>\n\u003cp>优点：执行阶段不访问主存；指令字短且执行速度快\u003c/p>\n\u003cp>缺点：寄存器价格昂贵，数量有限\u003c/p>\n\u003cp>寄存器间接寻址\u003c/p>\n\u003cp>\u003cspan class=\"math-display\">\u003cspan class=\"katex-display\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003csemantics>\u003cmrow>\u003cmi>E\u003c/mi>\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">EA=(R_i)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0576em;\">E\u003c/span>\u003cspan class=\"mord mathnormal\">A\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">=\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"katex-base\">\u003cspan class=\"katex-strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.0077em;\">R\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3117em;\">\u003cspan style=\"top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"katex-sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/04-image-4.png\" alt=\"image.png\">\u003c/p>\n\u003cp>与一般间接寻址相比速度更快\u003c/p>\n\u003cp>相对寻址\u003c/p>\n\u003cp>EA=(PC)+A\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/05-image-5.png\" alt=\"image.png\">\u003c/p>\n\u003cp>A是相对于PC所指地址的位移量\u003c/p>\n\u003cp>优点：一段代码在程序内浮动时不用更改跳转指令的地址码，广泛应用于转移指令\u003c/p>\n\u003cp>基址寻址\u003c/p>\n\u003cp>EA=(BR)+A\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/06-image-6.png\" alt=\"image.png\">\u003c/p>\n\u003cp>程序运行前，CPU将BR的值修改为该程序的起始地址\u003c/p>\n\u003cp>BR作为基地址，A为偏移量\u003c/p>\n\u003cp>优点：便于（整个）程序浮动，方便多道程序并发运行\u003c/p>\n\u003cp>变址寻址\u003c/p>\n\u003cp>EA=(IX)+A\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/07-image-7.png\" alt=\"image.png\">\u003c/p>\n\u003cp>IX的内容可由用户改变\u003c/p>\n\u003cp>IX作为偏移量，A作为基地址\u003c/p>\n\u003cp>优点：可以不断改变IX的内容，适合编制循环程序\u003c/p>\n\u003cp>堆栈寻址\u003c/p>\n\u003cp>操作数存放在堆栈中，隐含使用SP作为操作数地址\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/08-image-8.png\" alt=\"image.png\">\u003c/p>\n\u003cp>堆栈是寄存器种一块特定的、按后进先出管理的存储区，SP存储在特定的寄存器中\u003c/p>\n\u003cp>硬堆栈：寄存器堆栈\u003c/p>\n\u003cp>软堆栈：从内存中划出一段区域做堆栈\u003c/p>\n","tags":["FORMULA","IMAGE"],"children":[]}]},{"id":"4-3","title":"4.3 程序的机器级代码表示","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"4-3-format","title":"AT&T 格式与 Intel 格式","hasDetail":true,"detailHtml":"\u003cp>4.3 程序的机器级代码表示\u003c/p>\n\u003cp>高级语言→汇编语言→机器语言\u003c/p>\n\u003cp>AT&amp;T格式 v.s. Intel格式\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/09-image-9.png\" alt=\"image.png\">\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/10-image-10.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"4-3-selection","title":"选择语句","hasDetail":true,"detailHtml":"\u003cp>选择语句的机器级表示\u003c/p>\n\u003cp>无条件转移指令jmp&lt;地址&gt;\u003c/p>\n\u003cp>常数\u003c/p>\n\u003cp>寄存器\u003c/p>\n\u003cp>主存\u003c/p>\n\u003cp>用&quot;标号&quot;锚定\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/11-image-11.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"4-3-loop","title":"循环语句","hasDetail":true,"detailHtml":"\u003cp>循环语句的机器级表示\u003c/p>\n\u003cp>条件转移指令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/12-image-12.png\" alt=\"image.png\">\u003c/p>\n\u003cp>loop指令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/13-image-13.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"4-3-function","title":"函数调用","hasDetail":true,"detailHtml":"\u003cp>函数调用的机器级表示\u003c/p>\n\u003cp>函数调用指令call &lt;函数名&gt;\u003c/p>\n\u003cp>1.将IP旧值压栈保存\u003c/p>\n\u003cp>2.设置IP新值，无条件转移至被调用函数的第一条指令\u003c/p>\n\u003cp>函数返回指令ret\u003c/p>\n\u003cp>从函数的栈帧顶部找到IP旧值，将其出栈并恢复IP寄存器\u003c/p>\n\u003cp>函数调用栈在内存中的位置\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/14-image-14.png\" alt=\"image.png\">\u003c/p>\n\u003cp>栈底（高地址）\u003c/p>\n\u003cp>栈顶（低地址）\u003c/p>\n\u003cp>访问栈帧数据\u003c/p>\n\u003cp>push、pop指令\u003c/p>\n\u003cp>push\u003c/p>\n\u003cp>先让esp-4,再让数据压入\u003c/p>\n\u003cp>pop\u003c/p>\n\u003cp>栈顶元素出栈，再让esp+4\u003c/p>\n\u003cp>mov指令\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/15-image-15.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]}]},{"id":"4-4","title":"4.4 CISC 和 RISC","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"4-4-comparison","title":"CISC 与 RISC","hasDetail":true,"detailHtml":"\u003cp>4.4 CISC和RISC\u003c/p>\n\u003cp>CISC：Complex Instruction Set Computer\u003c/p>\n\u003cp>复杂、庞大\u003c/p>\n\u003cp>指令数目：&gt;200\u003c/p>\n\u003cp>指令字长：不固定\u003c/p>\n\u003cp>可访存指令：不加限制\u003c/p>\n\u003cp>微程序控制\u003c/p>\n\u003cp>RISC：Reduced Instruction Set Computer\u003c/p>\n\u003cp>简单、精简\u003c/p>\n\u003cp>指令数目：&gt;100\u003c/p>\n\u003cp>指令字长：定长\u003c/p>\n\u003cp>可访存指令：Load/Store指令\u003c/p>\n\u003cp>组合逻辑控制\u003c/p>\n","tags":[],"children":[]},{"id":"4-4-process","title":"计算机的工作过程","hasDetail":true,"detailHtml":"\u003cp>计算机的工作过程\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/instruction-set/16-image-16.png\" alt=\"image.png\">\u003c/p>\n","tags":["IMAGE"],"children":[]}]}]}</script></section></main><footer class="site-footer"><div class="footer-inner wrap"><p>© 2026 Vangie</p></div></footer></body></html>
