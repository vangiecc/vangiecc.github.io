map">Reset</button><button type="button" aria-label="Collapse all branches">Collapse all</button></div><div class="mind-map-viewport" tabindex="0"><svg class="mind-map-connectors" aria-hidden="true"></svg><div class="mind-map-world"><div class="mind-map-nodes"><button class="mind-map-node mind-map-node--root" type="button" data-node-id="root" aria-expanded="true">总线</button><button class="mind-map-node mind-map-node--section" type="button" data-node-id="6-1" aria-expanded="false">6.1 总线概述</button><button class="mind-map-node mind-map-node--section" type="button" data-node-id="6-2" aria-expanded="false">6.2 总线事务和定时</button></div></div><p class="mind-map-fallback">Interactive expansion requires JavaScript.</p></div><script type="application/json" id="mind-map-data">{"id":"root","title":"总线","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"6-1","title":"6.1 总线概述","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"6-1-definition","title":"定义、特点与特性","hasDetail":true,"detailHtml":"\u003cp>6.1 总线概述\u003c/p>\n\u003cp>目的：为了更好地解决I/O设备和主机之间连接的灵活性\u003c/p>\n\u003cp>定义\u003c/p>\n\u003cp>一组能够为多个部件\u003cstrong>分时\u003c/strong>和\u003cstrong>共享\u003c/strong>的公共信息传送线路\u003c/p>\n\u003cp>特点\u003c/p>\n\u003cp>分时\u003c/p>\n\u003cp>同一时刻只允许有一个部件向总线发送信息\u003c/p>\n\u003cp>共享\u003c/p>\n\u003cp>总线上可以挂接多个部件\u003c/p>\n\u003cp>特性\u003c/p>\n\u003cp>机械特性\u003c/p>\n\u003cp>电气特性\u003c/p>\n\u003cp>功能特性\u003c/p>\n\u003cp>时间特性\u003c/p>\n","tags":[],"children":[]},{"id":"6-1-classification","title":"总线的分类","hasDetail":true,"detailHtml":"\u003cp>分类\u003c/p>\n\u003cp>按数据传输格式\u003c/p>\n\u003cp>串行总线\u003c/p>\n\u003cp>优点：只需1根传输线，适用于长距离\u003c/p>\n\u003cp>缺点：数据发送和接收的时候要进行拆卸和装配，要考虑串行-并行转换的问题\u003c/p>\n\u003cp>并行总线\u003c/p>\n\u003cp>优点：逻辑时序比较简单，电路容易\u003c/p>\n\u003cp>缺点：信号线数量多，工作频率高时，信号线之间会产生干扰\u003c/p>\n\u003cp>按功能层次\u003c/p>\n\u003cp>片内总线\u003c/p>\n\u003cp>CPU芯片内部寄存器与寄存器、寄存器与ALU之间\u003c/p>\n\u003cp>系统总线\u003c/p>\n\u003cp>计算机系统内部各功能部件之间相互连接的总线\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/07-image.png\" alt=\"image.png\">\u003c/p>\n\u003cp>数据总线\u003c/p>\n\u003cp>地址总线\u003c/p>\n\u003cp>控制总线\u003c/p>\n\u003cp>按照结构分类\u003c/p>\n\u003cp>单总线\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/01-image-1.png\" alt=\"image.png\">\u003c/p>\n\u003cp>缺点：带宽低、负载重，不支持并发传送\u003c/p>\n\u003cp>双总线\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/02-image-2.png\" alt=\"image.png\">\u003c/p>\n\u003cp>优点：将低速的I/O设备从单总线上分离出来，实现存储器总线和I/O总线分离\u003c/p>\n\u003cp>缺点：需要增加通道等硬件设备\u003c/p>\n\u003cp>缓和CPU和I/O设备之间速度不匹配的矛盾\u003c/p>\n\u003cp>三总线\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/03-image-3.png\" alt=\"image.png\">\u003c/p>\n\u003cp>优点：提高了I/O设备的性能，使其更快地响应命令，提高系统吞吐量\u003c/p>\n\u003cp>缺点：任意时刻只能使用一种总线，系统工作效率较低\u003c/p>\n\u003cp>缓和CPU和磁盘之间的矛盾\u003c/p>\n\u003cp>通信总线\u003c/p>\n\u003cp>计算机系统之间、计算机系统与其他系统之间信息传送的总线\u003c/p>\n","tags":["IMAGE"],"children":[]},{"id":"6-1-performance","title":"性能指标","hasDetail":true,"detailHtml":"\u003cp>性能指标\u003c/p>\n\u003cp>总线周期：一次总线操作所需的时间\u003c/p>\n\u003cp>时钟周期：机器的时钟周期\u003c/p>\n\u003cp>工作频率：总线周期的倒数\u003c/p>\n\u003cp>时钟频率：时钟周期的倒数\u003c/p>\n\u003cp>总线宽度：通常指数据总线的根数，同时能够传输的数据位数\u003c/p>\n\u003cp>总线带宽：数据传输率，单位时间内总线上可传输数据的位数\u003c/p>\n\u003cp>总线带宽=总线工作频率×总线宽度（bit/s）\u003c/p>\n\u003cp>总线带宽=总线宽度（bit/s）/总线周期\u003c/p>\n\u003cp>总线复用：一种信号线在不同的时间传输不同的信息\u003c/p>\n\u003cp>信号线数：地址总线、数据总线和控制总线3种总线数的总和称为信号线数\u003c/p>\n","tags":[],"children":[]}]},{"id":"6-2","title":"6.2 总线事务和定时","hasDetail":false,"detailHtml":"","tags":[],"children":[{"id":"6-2-cycle","title":"总线周期","hasDetail":true,"detailHtml":"\u003cp>6.2 总线事务和定时\u003c/p>\n\u003cp>总线事务：从请求总线到完成总线使用的操作序列称为总线事务\u003c/p>\n\u003cp>总线周期\u003c/p>\n\u003cp>申请分配阶段\u003c/p>\n\u003cp>寻址阶段\u003c/p>\n\u003cp>传输阶段\u003c/p>\n\u003cp>结束阶段\u003c/p>\n","tags":[],"children":[]},{"id":"6-2-timing","title":"总线定时","hasDetail":true,"detailHtml":"\u003cp>总线定时\u003c/p>\n\u003cp>同步通信：统一时钟\u003c/p>\n\u003cp>异步通信：应答方式\u003c/p>\n\u003cp>不互锁方式\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/04-image-4.png\" alt=\"image.png\">\u003c/p>\n\u003cp>半互锁方式\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/05-image-5.png\" alt=\"image.png\">\u003c/p>\n\u003cp>全互锁方式\u003c/p>\n\u003cp>\u003cimg src=\"/notes/computer-organization/assets/buses/06-image-6.png\" alt=\"image.png\">\u003c/p>\n\u003cp>半同步通信：同步、异步结合\u003c/p>\n\u003cp>分离式通信：充分挖掘系统总线每瞬间的潜力\u003c/p>\n","tags":["IMAGE"],"children":[]}]}]}</script></section></main><footer class="site-footer"><div class="footer-inner wrap"><p>© 2026 Vangie</p></div></footer></body></html>
